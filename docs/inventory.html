<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 馆藏盘点</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only active" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2>馆藏盘点</h2>
                <button class="btn btn-primary" onclick="showModal()">新建盘点</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>盘点名称</th>
                        <th>类型</th>
                        <th>区域</th>
                        <th>应盘</th>
                        <th>实盘</th>
                        <th>缺失</th>
                        <th>多出</th>
                        <th>状态</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>创建人</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable">
                </tbody>
            </table>

            <div class="panel" id="itemsPanel" style="display:none; margin-top:20px;">
                <h3 id="itemsTitle">盘点明细</h3>
                <table class="table item-table">
                    <thead>
                        <tr>
                            <th>ISBN</th>
                            <th>书名</th>
                            <th>系统状态</th>
                            <th>实盘状态</th>
                            <th>备注</th>
                            <th>盘点时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTable">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal" id="inventoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新建盘点</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="inventoryForm">
                <div class="form-group">
                    <label for="invName">盘点名称</label>
                    <input type="text" id="invName" required>
                </div>
                <div class="form-group">
                    <label for="invType">盘点类型</label>
                    <select id="invType" onchange="toggleArea()" required>
                        <option value="1">全盘</option>
                        <option value="2">区域盘点</option>
                        <option value="3">抽样盘点</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="invArea">盘点区域（区域盘点必填）</label>
                    <input type="text" id="invArea" placeholder="如：三楼A区">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/demo-mock.js"></script>
    <script src="js/inventory.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
