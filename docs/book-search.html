<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 图书查询</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html" class="active">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="search-section">
                <h2>图书查询</h2>
                <div class="search-form">
                    <input type="text" id="searchKeyword" placeholder="输入书名、作者、ISBN或分类">
                    <button class="btn btn-primary" onclick="searchBooks()">搜索</button>
                </div>
            </div>
            
            <div class="filter-section">
                <select id="categoryFilter" onchange="filterBooks()">
                    <option value="">全部分类</option>
                    <option value="编程">编程</option>
                    <option value="计算机">计算机</option>
                    <option value="数据库">数据库</option>
                    <option value="算法">算法</option>
                    <option value="前端">前端</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            
            <div class="book-grid" id="bookGrid">
            </div>
        </main>
    </div>
    
    <!-- 图书详情模态框 -->
    <div class="modal" id="bookDetailModal">
        <div class="modal-content book-detail-modal">
            <div class="modal-header">
                <h3 id="detailTitle">图书详情</h3>
                <button class="close-btn" onclick="closeBookDetail()">&times;</button>
            </div>
            <div class="book-detail-content">
                <div class="book-detail-image">
                    <img id="detailImage" src="" alt="图书封面">
                </div>
                <div class="book-detail-info">
                    <div class="detail-row">
                        <span class="detail-label">作者:</span>
                        <span id="detailAuthor">未知</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">ISBN:</span>
                        <span id="detailISBN">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">出版社:</span>
                        <span id="detailPublisher">未知</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">出版日期:</span>
                        <span id="detailPublishDate">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">分类:</span>
                        <span id="detailCategory">未分类</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">价格:</span>
                        <span id="detailPrice">¥0.00</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">库存:</span>
                        <span id="detailStock">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">存放位置:</span>
                        <span id="detailLocation">-</span>
                    </div>
                    <div class="detail-row description-row">
                        <span class="detail-label">简介:</span>
                        <p id="detailDescription">暂无简介</p>
                    </div>
                    <div class="detail-actions">
                        <button class="btn btn-primary" id="borrowBtn">申请借阅</button>
                        <button class="btn btn-secondary" onclick="closeBookDetail()">关闭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/demo-mock.js"></script>
    <script src="js/book-search.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
