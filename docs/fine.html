<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 罚金管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html" class="active">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2>罚金管理</h2>
            </div>

            <div class="panel">
                <h3>我的未缴罚金</h3>
                <p>当前未缴合计：<b id="unpaidTotal" style="color:#e74c3c;font-size:20px;">0.00</b> 元</p>
            </div>

            <div class="filter-section">
                <select id="statusFilter" onchange="loadList()">
                    <option value="">全部</option>
                    <option value="0">未缴纳</option>
                    <option value="1">已缴纳</option>
                    <option value="2">已减免</option>
                </select>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>用户</th>
                        <th>图书</th>
                        <th>金额(元)</th>
                        <th>逾期天数</th>
                        <th>费率(元/天)</th>
                        <th>原因</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>缴纳时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="fineTable">
                </tbody>
            </table>
        </main>
    </div>

    <div class="modal" id="waiveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>减免罚金</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="waiveForm">
                <input type="hidden" id="waiveId">
                <div class="form-group">
                    <label for="waiveReason">减免原因</label>
                    <textarea id="waiveReason" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确认减免</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/demo-mock.js"></script>
    <script src="js/fine.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
