<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 我的借阅历史</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html" class="active">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2>我的借阅历史</h2>
                <button class="btn btn-primary" onclick="exportHistory()">导出记录</button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-icon">📚</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stTotal">-</div>
                        <div class="stat-label">累计借阅</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📖</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stBorrowing">-</div>
                        <div class="stat-label">借阅中</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stReturned">-</div>
                        <div class="stat-label">已归还</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏰</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stOverdue">-</div>
                        <div class="stat-label">逾期未还</div>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <select id="statusFilter" onchange="applyFilter()">
                    <option value="">全部状态</option>
                    <option value="0">借阅中</option>
                    <option value="1">已归还</option>
                    <option value="overdue">已逾期</option>
                </select>
                <input type="text" id="keyword" placeholder="搜索书名 / 作者 / 分类" oninput="applyFilter()" style="padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;">
                <input type="date" id="dateFrom" onchange="applyFilter()" title="借阅起始日期">
                <span style="line-height:38px;color:#999;">至</span>
                <input type="date" id="dateTo" onchange="applyFilter()" title="借阅结束日期">
                <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>封面</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>分类</th>
                        <th>借阅日期</th>
                        <th>应还日期</th>
                        <th>归还日期</th>
                        <th>状态</th>
                        <th>罚金</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                </tbody>
            </table>

            <div id="pager" style="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px;">
                <button class="btn btn-secondary" id="prevBtn" onclick="gotoPage(currentPage - 1)">上一页</button>
                <span id="pageInfo" style="color:#666;font-size:14px;">第 1 / 1 页</span>
                <button class="btn btn-secondary" id="nextBtn" onclick="gotoPage(currentPage + 1)">下一页</button>
            </div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/demo-mock.js"></script>
    <script src="js/my-borrow-history.js"></script>
    <script>if(!guardAccess()){}</script>
</body>
</html>
