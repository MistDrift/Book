<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 遗失理赔</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html" class="active">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2>遗失理赔</h2>
                <button class="btn btn-primary" onclick="showModal()">图书报失</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>报失人</th>
                        <th>图书</th>
                        <th>报失日期</th>
                        <th>赔偿方式</th>
                        <th>书价(元)</th>
                        <th>折旧率</th>
                        <th>应赔金额(元)</th>
                        <th>实赔金额(元)</th>
                        <th>状态</th>
                        <th>处理备注</th>
                        <th>赔付时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="claimTable">
                </tbody>
            </table>
        </main>
    </div>

    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>图书报失</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="reportForm">
                <div class="form-group">
                    <label for="borrowSelect">选择借阅中的图书</label>
                    <select id="borrowSelect" required>
                    </select>
                </div>
                <div class="form-group">
                    <label for="typeSelect">赔偿方式</label>
                    <select id="typeSelect" required>
                        <option value="1">按原价赔偿</option>
                        <option value="2">按折旧价赔偿</option>
                        <option value="3">自行购买原书</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">提交报失</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="handleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="handleTitle">处理理赔</h3>
                <button class="close-btn" onclick="closeHandleModal()">&times;</button>
            </div>
            <form id="handleForm">
                <input type="hidden" id="handleId">
                <input type="hidden" id="handleAction">
                <div class="form-group" id="paidGroup">
                    <label for="paidInput">实赔金额(元)</label>
                    <input type="number" id="paidInput" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="handleRemark">处理备注</label>
                    <textarea id="handleRemark" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeHandleModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确认</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/demo-mock.js"></script>
    <script src="js/claim.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
