<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 个人设置</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html" class="active">个人设置</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <h2>个人设置</h2>
            <div class="profile-form">
                <h3 style="margin-bottom: 15px; color: #333;">基本资料</h3>
                <form id="profileForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" readonly>
                    </div>
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label for="phone">电话</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
            <div class="profile-form" style="margin-top: 20px;">
                <h3 style="margin-bottom: 15px; color: #333;">修改密码</h3>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="oldPassword">原密码</label>
                        <input type="password" id="oldPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">修改密码</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
