<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 信用管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html" class="active">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2>信用管理</h2>
            </div>

            <div id="userSection">
                <div class="credit-card">
                    <div>我的信用分</div>
                    <div class="credit-score" id="myCredit">-</div>
                    <div class="credit-tip">信用分满分100分，低于60分将不可借阅图书</div>
                </div>

                <div class="panel">
                    <h3>我的信用记录</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>变动</th>
                                <th>变动前</th>
                                <th>变动后</th>
                                <th>原因</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="myCreditTable">
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="adminSection" style="display:none;">
                <div class="panel">
                    <h3>调整用户信用分</h3>
                    <form class="inline-form" id="adjustForm">
                        <div class="form-group">
                            <label for="userSelect">选择用户</label>
                            <select id="userSelect" required>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="deltaInput">变动分值（正加负减）</label>
                            <input type="number" id="deltaInput" required>
                        </div>
                        <div class="form-group">
                            <label for="reasonInput">调整原因</label>
                            <input type="text" id="reasonInput" required>
                        </div>
                        <button type="submit" class="btn btn-primary">提交调整</button>
                    </form>
                </div>

                <div class="panel">
                    <h3>全部信用记录</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>用户</th>
                                <th>变动</th>
                                <th>变动前</th>
                                <th>变动后</th>
                                <th>原因</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="allCreditTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/credit.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
