<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 用户注册</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        .login-card {
            max-width: 500px;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .register-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .register-desc {
            font-size: 14px;
            color: #64748b;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group.full-width {
            grid-column: span 2;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
        
        .back-link a {
            color: #667eea;
            font-weight: 500;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .success-message {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border: 1px solid #86efac;
            color: #166534;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 背景装饰 -->
        <div class="bg-decoration">
            <div class="gradient-circle circle-1"></div>
            <div class="gradient-circle circle-2"></div>
            <div class="gradient-circle circle-3"></div>
        </div>
        
        <!-- 注册卡片 -->
        <div class="login-card">
            <div class="register-header">
                <h1 class="register-title">用户注册</h1>
                <p class="register-desc">创建您的账户，开始借阅图书之旅</p>
                <div class="title-divider"></div>
            </div>
            
            <div class="success-message" id="successMessage">
                ✅ 注册成功！即将跳转到登录页面...
            </div>
            
            <form id="registerForm" class="login-form">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
                        <label class="form-label" for="username">用户名</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="text" id="name" name="name" class="form-input" placeholder="请输入姓名" required>
                        <label class="form-label" for="name">姓名</label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                        <label class="form-label" for="password">密码</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="请确认密码" required>
                        <label class="form-label" for="confirmPassword">确认密码</label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱（选填）">
                        <label class="form-label" for="email">邮箱</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="请输入手机号（选填）">
                        <label class="form-label" for="phone">手机号</label>
                    </div>
                </div>

                <div class="form-group">
                    <select id="role" name="role" class="form-input">
                        <option value="0">社会人员</option>
                        <option value="2">线上学员</option>
                        <option value="3">教师</option>
                    </select>
                    <label class="form-label" for="role">身份类型</label>
                </div>
                
                <button type="submit" class="login-btn">
                    立即注册
                </button>
            </form>
            
            <div class="back-link">
                <a href="index.html">已有账号？立即登录</a>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            // 角色由表单下拉决定，默认社会人员（管理员不可自行注册）
            data.role = data.role !== undefined ? parseInt(data.role, 10) : 0;

            apiFetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(response) {
                if (!response.ok) {
                    // 后端返回了具体错误信息
                    return response.json().then(function(d) {
                        throw new Error(d.message || '注册失败 (HTTP ' + response.status + ')');
                    });
                }
                return response.json();
            })
            .then(function(result) {
                if (result.success) {
                    document.getElementById('successMessage').classList.add('show');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    alert(result.message || '注册失败');
                }
            })
            .catch(function(err) {
                // 真实错误（后端拒绝 / 网络问题）→ 明确展示，不再 mock 成功
                alert('注册失败：' + (err.message || '无法连接后端'));
            });
        });
    </script>
</body>
</html>
