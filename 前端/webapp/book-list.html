<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 图书管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only active" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="page-header">
                <h2>图书管理</h2>
                <button class="btn btn-primary" onclick="showAddModal()" id="addBtn">添加图书</button>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>图片</th>
                        <th>ISBN</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>出版社</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="bookTable">
                </tbody>
            </table>
        </main>
    </div>
    
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加图书</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" required>
                </div>
                <div class="form-group">
                    <label for="title">书名</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="author">作者</label>
                    <input type="text" id="author" required>
                </div>
                <div class="form-group">
                    <label for="publisher">出版社</label>
                    <input type="text" id="publisher" required>
                </div>
                <div class="form-group">
                    <label for="publishDate">出版日期</label>
                    <input type="date" id="publishDate" required>
                </div>
                <div class="form-group">
                    <label for="category">分类</label>
                    <select id="category" required>
                        <option value="编程">编程</option>
                        <option value="计算机">计算机</option>
                        <option value="数据库">数据库</option>
                        <option value="算法">算法</option>
                        <option value="前端">前端</option>
                        <option value="Java">Java</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">价格</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="stock">库存</label>
                    <input type="number" id="stock" required>
                </div>
                <div class="form-group">
                    <label for="description">简介</label>
                    <textarea id="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="image">图书图片</label>
                    <div style="margin-bottom:10px;">
                        <img id="imagePreview" src="" alt="图片预览" style="max-width:200px;max-height:200px;border-radius:4px;display:none;">
                    </div>
                    <input type="hidden" id="image">
                    <input type="file" id="imageFile" accept="image/*" onchange="uploadImage()">
                    <div style="margin-top:5px;font-size:12px;color:#666;">支持 jpg, png, gif 格式，最大10MB</div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/book-list.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
