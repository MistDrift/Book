            <div class="page-header">

            <div class="panel">
                <h3>授权新管理员</h3>
                <form class="inline-form" id="grantForm">
                    <div class="form-group">
                        <label for="grantUserSelect">选择非管理员用户</label>
                        <select id="grantUserSelect" required>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">授权为管理员</button>
                </form>
            </div>
