<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 借阅管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📚 图书管理系统</div>
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul>
                <li><a href="home.html">首页</a></li>
                <li><a href="dashboard.html" class="admin-only" style="display:none">数据看板</a></li>
                <li><a href="book-list.html" class="admin-only" style="display:none">图书管理</a></li>
                <li><a href="book-search.html">图书查询</a></li>
                <li><a href="borrow-list.html" class="active">借阅管理</a></li>
                <li><a href="my-borrow-history.html">我的借阅历史</a></li>
                <li><a href="borrow-apply.html">借阅申请</a></li>
                <li><a href="reserve.html">预约管理</a></li>
                <li><a href="fine.html">罚金管理</a></li>
                <li><a href="claim.html">遗失理赔</a></li>
                <li><a href="inventory.html" class="admin-only" style="display:none">馆藏盘点</a></li>
                <li><a href="suggestion.html">图书荐购</a></li>
                <li><a href="notice.html">消息中心</a></li>
                <li><a href="credit.html">信用管理</a></li>
                <li><a href="user-list.html" class="admin-only" style="display:none">用户管理</a></li>
                <li><a href="tier-list.html" class="admin-only" style="display:none">等级管理</a></li>
                <li><a href="perm-list.html" class="admin-only" style="display:none">权限管理</a></li>
                <li><a href="log-list.html" class="admin-only" style="display:none">操作日志</a></li>
                <li><a href="profile.html">个人设置</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="page-header">
                <h2>借阅管理</h2>
                <div>
                    <button class="btn btn-secondary" onclick="exportBorrows()">导出记录</button>
                    <button class="btn btn-primary" onclick="showBorrowModal()" id="borrowBtn">借阅图书</button>
                </div>
            </div>
            
            <div class="filter-section">
                <select id="statusFilter" onchange="loadBorrows()">
                    <option value="">全部</option>
                    <option value="0">借阅中</option>
                    <option value="1">已归还</option>
                    <option value="overdue">已逾期</option>
                </select>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>封面</th>
                        <th>书名</th>
                        <th>借阅人</th>
                        <th>借阅日期</th>
                        <th>应还日期</th>
                        <th>归还日期</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="borrowTable">
                </tbody>
            </table>
        </main>
    </div>
    
    <div class="modal" id="borrowModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>借阅图书</h3>
                <button class="close-btn" onclick="closeBorrowModal()">&times;</button>
            </div>
            <form id="borrowForm" onsubmit="submitBorrowForm(); return false;">
                <div class="form-group" id="userSelectGroup" style="display:none;">
                    <label for="borrowUser">借阅人</label>
                    <select id="borrowUser" required>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookSelect">选择图书</label>
                    <select id="bookSelect" required>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeBorrowModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确认借阅</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/borrow-list.js"></script>
<script>if(!guardAccess()){}</script>
</body>
</html>
